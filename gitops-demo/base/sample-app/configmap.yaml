apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: sample-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>GitOps Demo - Slalom</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          text-align: center;
          padding: 50px;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
          color: white;
          min-height: 100vh;
          margin: 0;
        }
        .container {
          max-width: 600px;
          margin: 0 auto;
          padding: 40px;
          background: rgba(255,255,255,0.1);
          border-radius: 15px;
          backdrop-filter: blur(10px);
        }
        h1 { font-size: 2.5em; color: #e94560; }
        .badge {
          display: inline-block;
          padding: 8px 20px;
          margin: 5px;
          border-radius: 20px;
          font-size: 0.9em;
        }
        .green { background: #2ecc71; }
        .blue { background: #3498db; }
        .purple { background: #9b59b6; }
        .info { color: #bdc3c7; margin-top: 30px; font-size: 0.9em; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>🚀 GitOps with Argo CD</h1>
        <p style="font-size: 1.3em;">Deployed automatically from GitHub!</p>
        <div>
          <span class="badge green">✅ Argo CD</span>
          <span class="badge blue">✅ AKS</span>
          <span class="badge purple">✅ Terraform</span>
        </div>
        <div class="info">
          <p>👤 Managed by: p.kumari@slalom.com</p>
          <p>📦 Source: github.com/priya131293/gitops-demo</p>
          <p>🔄 Any change to Git = Auto-deployed!</p>
        </div>
      </div>
    </body>
    </html>